plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+fabric-mc${minecraft_version}"
group = maven_group
base { archivesName = archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

loom {
    accessWidenerPath = file('src/main/resources/createaddition.accesswidener')
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        java {
            // Datagen is stubbed (the committed src/generated/resources are used); see PORTING-26.1.md.
            exclude 'com/mrh0/createaddition/datagen/**'
            // Compat excluded for the first pass (no 26.1 Fabric builds wired up yet).
            exclude 'com/mrh0/createaddition/compat/jei/**'
            exclude 'com/mrh0/createaddition/compat/computercraft/**'
            exclude 'com/mrh0/createaddition/compat/sable/**'
            exclude 'com/mrh0/createaddition/compat/simulated/**'
            exclude 'com/mrh0/createaddition/mixin/DockingConnectorBEMixin.java'
            exclude 'com/mrh0/createaddition/mixin/VanillaSubLevelBERenderMixin.java'
        }
    }
}

dependencies {
    // 26.1 is unobfuscated: no mappings, and Loom no longer remaps (non-remap "fabric-loom" plugin).
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    implementation "teamreborn:energy:${tr_energy_version}"
    include "teamreborn:energy:${tr_energy_version}"

    implementation files(create_fly_jar)

    // Used by the relocated Registrate port (com.mrh0.createaddition.port.registrate)
    compileOnly "org.projectlombok:lombok:1.18.42"
    annotationProcessor "org.projectlombok:lombok:1.18.42"
}

processResources {
    // Hand-crafted resources take priority over datagen output (as upstream).
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def props = [
            version                   : project.version,
            minecraft_version         : minecraft_version,
            fabric_loader_version     : fabric_loader_version,
            fabric_api_version        : fabric_api_version,
            forgeconfigapiport_version: forgeconfigapiport_version,
            create_fly_version_range  : create_fly_version_range,
            tr_energy_version         : tr_energy_version
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand props }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from('LICENSE') { rename { "LICENSE_createaddition" } }
}
